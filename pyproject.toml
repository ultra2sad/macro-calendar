[project]
name = "macro-calendar"
version = "0.1.0"
description = "Scrapes central bank meeting dates and US macro release dates into Excel and .ics"
requires-python = ">=3.11"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
